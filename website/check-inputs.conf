# The inputs of the website check outside website/: the files that
# ./check.sh --build reads, so that scripts/verify.conf runs the check when
# one of them changes ('inputs: website website @website/check-inputs.conf';
# docs/development.md, "The inputs of a check"). A change to website/ always
# runs it, this file included.
#
# Format: one entry per line; '#' starts a comment.
#
# - '<path>': a file whose content the check reads. The check runs when it
#   changes. check.sh --build fails when a source of the site names a file
#   outside website/ by a relative path ('../') that is not listed here.
# - 'exists <path>': a path whose existence alone the check reads, a
#   repository file a page links to or a script a page names. The check runs
#   when it is added or removed, as by a rename, and not when its content
#   changes. check.sh --build fails when a page names a path that is not
#   listed, and when a listed path is named by no page: the list is exact.

# The files the sources read.
.agents/agents.conf
.agents/policies/risk.conf
scripts/verify.conf

