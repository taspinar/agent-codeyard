# The notification hook of ./scripts/status.sh --changes (docs/development.md,
# "Notified on change").
#
# Format: one line 'command: <shell command>'. The command runs in the
# primary checkout and gets exactly the output of --changes on standard
# input, only when something changed. When it fails, the changes are kept and
# sent again by the next --changes. Without a command line, --changes only
# prints. Only this file of the primary checkout is read, never the copy of a
# feature worktree.
#
# Uncomment one, or write your own. A notification that reaches you is the
# setup to have: a run that waits for your decision waits until you look.
#
# A comment on a tracking Issue:
# command: gh issue comment <tracking-issue> --body-file -
#
# A notification on macOS:
# command: osascript -e "display notification \"$(head -c 200)\" with title \"Features\""
#
# A mail:
# command: mail -s "Feature status" you@example.com
