# Self-tests of the workflow scripts, run by ./scripts/verify.sh.
#
# These checks test the workflow itself (scripts/, the agent contracts, the
# schemas, the policies, the ignore rules for review and triage files, and the
# CI workflows that run them), not the project. They run only when a file listed under 'paths:' differs from the
# base branch (origin/main, or main), counting uncommitted and untracked
# files, or when that cannot be determined. './scripts/verify.sh --all' always
# runs them; CI uses it on main, nightly, and on every pull request of the
# template (docs/development.md, "Workflow self-tests").
#
# Format: as scripts/verify.conf, one '<name>: <command>' per line (a check
# may name a group, '<name> [<group>]: <command>'), plus the
# reserved entry 'paths:' with the Git pathspecs of the workflow files,
# separated by spaces. An entry ':(exclude)<path>' removes a file from the
# list.
#
# 'budget-seconds: <n>' is the target for the duration of all checks of this
# file in one run, as in scripts/verify.conf: a measurement, never a failure.
# 600 s is a target for this template's own suite, which took 915 s when it
# was set; change or remove the line like any line of this file.
#
# .github/workflows (the template's CI files and a project's own workflows),
# .agents/policies, .agents/template.conf, and docs/examples/parallel-ci.yml
# (check-ci-groups reads it) are listed: CI runs the self-tests, a sync of
# the template changes them, and a pull request that changes or adds only one
# of them still runs the self-tests.
#
# 'scripts' is listed as a whole, so a new script is guarded until it is
# excluded. scripts/verify.conf is excluded: a project adds its checks there
# and no self-test reads it. Exclude a project's own scripts the same way,
# after checking that no test in this file reads or copies them. Delete this
# file when the project removes the workflow scripts.

budget-seconds: 600

paths: scripts .agents/prompts .agents/schemas .agents/policies .agents/agents.conf .agents/template.conf .github/workflows docs/examples/parallel-ci.yml .gitignore :(glob)tests/*-test.sh tests/lib-fakes.sh tests/lib-run-feature.sh :(exclude)scripts/verify.conf

# The longest self-tests come first: tests/adopted-project-test.sh starts
# them in this order, and so does ./scripts/verify.sh with 'parallel:' in
# scripts/verify.conf, so a long test listed late would end last.
# adopted-project, the longest, is the first: in a parallel run it holds one
# of the slots from the start while the others take the rest
# (docs/development.md, "Checks at the same time"); it does not run inside
# itself. The tests of scripts/run-feature.sh are split into parts that share
# tests/lib-run-feature.sh and its scenario register.
#
# Each check names its group: .github/workflows/ci.yml runs every group in
# a job of its own, 'group-<group>', at the same time (docs/development.md,
# "A parallel CI"). adopted-project, the longest, is a group of its own; the
# others are spread over self-tests-1 to self-tests-3 by their duration on
# CI, not by their count, so that no group takes longer than adopted-project
# (about 490 s each, adopted-project 563 s, on CI of #447). A new self-test
# goes into the group with the least time; a group that grows past
# adopted-project holds up the required check. A new group needs its job in
# ci.yml: scripts/check-ci-groups.sh --workflow fails without it.
adopted-project [adopted-project]: ./tests/adopted-project-test.sh
run-feature-rounds [self-tests-2]: ./tests/run-feature-rounds-test.sh
run-feature-verification [self-tests-3]: ./tests/run-feature-verification-test.sh
run-feature-fixes [self-tests-3]: ./tests/run-feature-fixes-test.sh
run-feature-policy [self-tests-1]: ./tests/run-feature-policy-test.sh
verify [self-tests-3]: ./tests/verify-test.sh
