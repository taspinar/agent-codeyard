# Self-tests of the workflow scripts, run by ./scripts/verify.sh.
#
# These checks test the workflow itself (scripts/, the agent contracts, the
# schemas, the policies, and the CI workflows of the template that run them),
# not the project. They run only when a file listed under 'paths:' differs from the
# base branch (origin/main, or main), counting uncommitted and untracked
# files, or when that cannot be determined. './scripts/verify.sh --all' always
# runs them; CI uses it on every pull request and push of the template, in a
# project on a push to main that changes a workflow file, and in a run
# started by hand (docs/development.md, "Workflow self-tests").
#
# Format: as scripts/verify.conf, one '<name>: <command>' per line (a check
# may name a group, '<name> [<group>]: <command>'), plus the
# reserved entry 'paths:' with the Git pathspecs of the workflow files,
# separated by spaces. An entry ':(exclude)<path>' removes a file from the
# list.
#
# A check may be framework-only, '<name> [<group>] framework: <command>':
# it tests the template as the framework, not the project that uses it, so
# it runs only in the template. In a repository whose origin is not the
# template that .agents/template.conf names, ./scripts/verify.sh skips it
# with a SKIP line and the reason; with no template.conf, a local path, or no
# or an unreadable origin it runs, and './scripts/verify.sh
# --framework-checks' runs it anywhere (docs/development.md, "Framework-only
# self-tests"). A self-test that reads the project's own state, or tests a
# script that a project uses, is never framework-only.
#
# 'budget-seconds: <n>' is the target for the duration of all checks of this
# file in one run, as in scripts/verify.conf: a measurement, never a failure.
# 600 s is a target for this template's own suite, which took 915 s when it
# was set; change or remove the line like any line of this file.
#
# The list names the workflow code only (Issue 462): the two CI files the
# template ships (.github/workflows/ci.yml and guardrails.yml, which run the
# self-tests), .agents/policies, and docs/examples/parallel-ci.yml
# (check-ci-groups reads it). The files a project is told to make its own,
# .agents/agents.conf, .agents/template.conf, .gitignore, and its own
# workflows under .github/workflows, are not listed: no self-test reads
# them, so a change of only those skips the self-tests. This list decides
# only which tests run: the risk policy and the merge gate classify these
# files as before (.agents/agents.conf and .github/workflows stay high
# and protected by the merge gate).
#
# 'scripts' is listed as a whole, so a new script is guarded until it is
# excluded. scripts/verify.conf is excluded: a project adds its checks there
# and only the template's own contract checks read it, in the template.
# Exclude a project's own scripts the same way, after checking that no test
# in this file reads or copies them. Delete this file when the project
# removes the workflow scripts.

budget-seconds: 600

paths: scripts .agents/prompts .agents/schemas .agents/policies .github/workflows/ci.yml .github/workflows/guardrails.yml docs/examples/parallel-ci.yml :(glob)tests/*-test.sh tests/lib-fakes.sh tests/lib-run-feature.sh :(exclude)scripts/verify.conf

# The longest self-tests come first: tests/adopted-project-test.sh starts
# them in this order, and so does ./scripts/verify.sh with 'parallel:' in
# scripts/verify.conf, so a long test listed late would end last.
# adopted-project is the first, from when it was the longest: in a parallel
# run it holds one of the slots from the start while the others take the
# rest (docs/development.md, "Checks at the same time"); it does not run
# inside itself. Being framework-only, it runs in the template only: in a project
# the direct self-tests already run on the project's real state. In the
# fixture it runs only the self-tests that read a file the fixture varies:
# the list fixture_tests of tests/adopted-project-test.sh names each with
# what it reads, and the test fails when a self-test that reads such a file
# is not on it (adopted-project-list tests that check). A new self-test that
# reads the repository it runs in goes on that list.
# './tests/adopted-project-test.sh --all' runs every self-test in the fixture
# by hand. './scripts/verify.sh --changed' never runs it; the full
# verification does (Issue 478). The tests of scripts/run-feature.sh are split into parts that share
# tests/lib-run-feature.sh and its scenario register.
#
# Each check names its group: .github/workflows/ci.yml runs every group in
# a job of its own, 'group-<group>', at the same time (docs/development.md,
# "A parallel CI"). adopted-project is a group of its own, with the check of
# its list; the others are spread over self-tests-1 to self-tests-3 by their
# duration on CI, not by their count (about 490 s each on CI of #447, when
# adopted-project took 563 s; since Issue 478 it runs 12 self-tests and took
# 71 to 134 s locally, and since Issue 486 the check of its list about 18 s
# alone instead of 224 to 431 s, so the group takes 1.5 to 2.5 minutes
# locally, one check after the other; its duration on CI is reported by the
# pull request of Issue 486, and it shows whether this group or the longest
# of the others sets the duration of the required check). A new self-test goes into the group with the least time. A new group needs its job in
# ci.yml: scripts/check-ci-groups.sh --workflow fails without it.
adopted-project [adopted-project] framework: ./tests/adopted-project-test.sh
# The check of the list of adopted-project (Issue 478), in its group, and
# framework-only like it. Its cases share two runs of the check in a copy of
# the repository ('./tests/adopted-project-test.sh --check-list', about 7 s
# for one run, most of it the scan of every self-test): one for the faults,
# one for the cases that pass (Issue 486). Measured locally 17.4 s and
# 17.6 s alone (2026-11-25), before Issue 486 3m44s and 4m05s alone and
# 312 s in a verification beside the other checks, when each case ran the
# check once.
adopted-project-list [adopted-project] framework: ./tests/adopted-project-list-test.sh
