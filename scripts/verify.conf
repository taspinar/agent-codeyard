# Required verification checks for ./scripts/verify.sh.
#
# Format: one check per line.
#
#   <name>: <command>
#
# - <name> uses lowercase letters, digits, and '-', and must be unique.
# - <command> runs with 'bash -eo pipefail' from the repository root, so a
#   failing step in a pipeline or command sequence fails the check.
# - The first word of <command> is the required tool. Verification fails when
#   it is missing or not executable, and when the command exits non-zero.
# - Every listed check is required. Remove a check instead of making it optional.
# - A check may name a group in square brackets after its name:
#   '<name> [<group>]: <command>'. './scripts/verify.sh --only <group>' runs
#   the checks of that group, for a CI that spreads the same checks over
#   parallel jobs. A check without a group belongs to the group 'default';
#   such a CI has to run that group too. A partial run verifies nothing:
#   only a run without --only does.
# - A check that runs one part of a split test suite declares that part, a
#   file that lists its tests, after its group:
#   '<name> [<group>] partition <file>: <command>'. scripts/check-ci-groups.sh
#   checks the declarations (docs/development.md, "A parallel CI").
#
# - One line 'budget-seconds: <n>' may set a target for the duration of all
#   checks of this file in one run, in seconds. Over it, the summary shows
#   BUDGET with the total, the target, and the five slowest checks, and the
#   run record keeps the result: a measurement, not a failure
#   (docs/development.md, "Budgets"). Without the
#   line nothing is compared; the duration of every check is recorded either
#   way.
#
# - One line 'parallel: <n>', in this file only, runs up to <n> checks of the
#   run at a time, over the checks of this file and of
#   scripts/verify-workflow.conf; the output of each check is printed as one
#   block when it ends, and the result is that of a run one at a time.
#   Without the line, or with 'parallel: 1', the checks run one at a time.
#   VERIFY_PARALLEL=<n> overrides it for one run, for example
#   VERIFY_PARALLEL=1 to run them one at a time while debugging
#   (docs/development.md, "Checks at the same time"). A sync of the template
#   never takes over the template's line: a project sets its own, measured on
#   its own checks and machine.
#
# - One line 'inputs: <check> <input>...' per check may name the inputs of a
#   check of this file: Git pathspecs, and '@<file>', a list file of the
#   repository whose lines are pathspecs, or 'exists <path>' for a path whose
#   existence alone the check reads. The check then runs only when an input
#   changed since the base branch (or the last trusted pass of a workflow
#   script's run), as the self-tests below are compared, and otherwise shows
#   SKIP with the reason; it runs when that cannot be determined, on the base
#   branch itself, and always with --all (docs/development.md, "The inputs of
#   a check"). A check whose inputs are not all listed can pass on a change
#   it never saw: list every file the check reads.
#
# The self-tests of the workflow scripts are not listed here but in
# scripts/verify-workflow.conf; they run only when a workflow file changed.
#
# Replace the template checks below with the checks of your project's stack,
# for example:
#
#   lint: ruff check .
#   tests: pytest
#
#   lint: npm run lint
#   type-check: npm run type-check
#   tests: npm test
#   build: npm run build

# The template runs 4 checks at a time: on its host of the runs (8 cores,
# 31 GB) its 47 self-tests took 707 s that way instead of about 2170 s one at
# a time, at a load of up to 8.6 and 3.1 GB of memory (Issue 450).
parallel: 4

template-structure: test -f AGENTS.md -a -f docs/architecture.md -a -f .agents/prompts/reviewer.md
shell-syntax: for file in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$file" || exit 1; done
docs-scripts: for script in scripts/*.sh scripts/lib/*.sh; do grep -Fq "$(basename "$script")" docs/project-map.md || { echo "docs/project-map.md does not mention $script"; exit 1; }; done
# The Markdown files name only files that exist. The paths after --later are
# what a project creates: its description, the approval of its planning, a
# change request, and the optional setup script of a worktree; and the
# workflow of the template's website, which a project deletes while the
# synced documents still name it.
docs-references: ./scripts/check-docs.sh --later docs/PROJECT_DESCRIPTION.md docs/PLANNING_APPROVAL.md docs/changes scripts/worktree-setup.sh .github/workflows/pages.yml
# The metadata of the project skills (.agents/project-skills/) is complete
# and matches their files; a project without skills passes.
skills: ./scripts/check-skills.sh
# The groups of both files match the jobs of the CI (docs/development.md,
# "A parallel CI"): every group has exactly one job group-<group> in
# .github/workflows/ci.yml. A CI that declares no VERIFY_GROUP, such as one
# job that runs ./scripts/verify.sh, needs no mapping, and the check passes.
ci-groups: test ! -f .github/workflows/ci.yml || ! grep -q 'VERIFY_GROUP:' .github/workflows/ci.yml || ./scripts/check-ci-groups.sh --workflow .github/workflows/ci.yml
# The website of the template is its own: a project does not have it. The
# site is recognised by its marker website/.codeyard-site; a project's own
# website/ directory has none and is skipped. npm ci runs only when the
# install is missing or older than package-lock.json: npm writes
# node_modules/.package-lock.json on every install, and the CI installs
# before the verification starts. It runs only when website/ or a file of
# website/check-inputs.conf changed, the files outside website/ that the site
# check reads; check.sh --build checks that the list is complete.
inputs: website website @website/check-inputs.conf
website: test ! -f website/.codeyard-site || { cd website && { { test -f node_modules/.package-lock.json && test ! node_modules/.package-lock.json -ot package-lock.json; } || npm ci --no-audit --no-fund --loglevel=error; } && ./check-test.sh && ./check.sh --build; }
