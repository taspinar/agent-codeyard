name: Documentation

# Publishes the documentation site of the template: builds the Astro project
# in website/ and publishes its output, nothing else of the repository.
# The site address and base path come from the Pages configuration of the
# repository, so the same build serves the project path and a custom domain.
#
# This workflow belongs to the template itself. It is not in the paths that
# sync-template.sh hands to a project, and it runs only in a repository that
# sets the variable PUBLISH_DOCUMENTATION to "true", so a project created
# from the template does not publish the template's documentation.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, the layout of GitHub's Pages starter workflow: "build" builds the
# site, checks the build, and uploads it, "deploy" only publishes the upload. In one job,
# deploy-pages listed the run's artifacts half a second after the upload and
# did not find it yet (Issue 475); the job boundary puts the upload safely
# behind the listing.
jobs:
  build:
    if: vars.PUBLISH_DOCUMENTATION == 'true'
    runs-on: ubuntu-latest
    steps:
      # Always the tip of the default branch, not the commit that started the
      # run: runs wait for each other and can finish out of order, and the
      # last one to finish must not publish an older version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install the dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      # The site is checked against the repository (./check.sh --build, with
      # the browser) by the website check of ./scripts/verify.sh, which the
      # push run of ci.yml runs with --all on this commit; this job checks
      # only the build it publishes (Issue 491).
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        working-directory: website
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Check the build that is published
        working-directory: website
        run: ./check.sh dist "${{ steps.pages.outputs.base_path }}/" "${{ steps.pages.outputs.origin }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: vars.PUBLISH_DOCUMENTATION == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
