name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The GITHUB_TOKEN of every job is read-only, whatever the repository's
# default workflow permissions are: contents for the checkout, packages for a
# project setup action that pulls from GitHub Packages. Nothing here writes
# with it; the artifact upload and the npm cache use the runner's own token.
# The setup action cannot widen it: a project whose setup needs more adds
# the permission here and keeps the change at every sync of the template.
# See docs/development.md, "The project's CI setup".
permissions:
  contents: read
  packages: read

# The workflow self-tests (scripts/verify-workflow.conf) take far longer than
# most projects' own checks. A pull request runs them, in the template and in
# a project, only when a file under 'paths:' of scripts/verify-workflow.conf
# changed since its base; a project's push to main likewise only when one
# changed since the commit before the push (a sync of the template changes
# them). The template runs them on every push to main. Both run everything
# when that commit cannot be determined (a first or a forced push). There
# is no nightly run: a run started by hand (workflow_dispatch) runs
# everything, in the template and in a project. The template is the
# repository that .agents/template.conf names under 'repository:'. The job
# 'scope' tells them apart with scripts/lib/template-repository.sh, the
# predicate with which ./scripts/verify.sh skips the framework-only
# self-tests outside the template, and names the group jobs that have
# nothing to run, which then do not start: the groups of self-tests when no
# workflow file changed, and in a project the groups whose self-tests are
# all framework-only. The aggregate 'verify' accepts exactly those skips
# (docs/development.md, "Workflow self-tests").
#
# The checks run in parallel jobs, one per group of checks
# (docs/development.md, "A parallel CI"): 'group-<group>' declares its group
# as 'env: VERIFY_GROUP: <group>' and runs ./scripts/verify.sh --only that
# group. The checks of scripts/verify.conf without a group, the project's
# own checks and the website of the template, run in group-default; the
# self-tests have the groups that scripts/verify-workflow.conf gives them.
# The job 'mapping' fails when a group has no job here, for example a group
# of a project's own: a project that adds one keeps this file as its own
# (':(exclude).github/workflows/ci.yml' in .agents/template.conf) and adds
# the job. The required check is the aggregate job 'verify', which passes
# only when every group job succeeded.
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      # The history without the file contents: the step compares commits,
      # and reads only the files it checks out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .agents/template.conf
            scripts/lib/template-repository.sh
            scripts/verify.conf
            scripts/verify-workflow.conf
          sparse-checkout-cone-mode: false
      - name: Decide which checks run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          # The commit to compare with: the one before a push, the base of a
          # pull request; empty on any other event.
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          # verify: 'all' (--all) or 'changed' (without --all, only when
          # no workflow file changed). This step decides, not verify.sh,
          # which compares with the project's base branch and not with
          # BASE: with a workflow change, or when it cannot tell, the
          # group jobs run with --all. skip: the group jobs that do not
          # start, as ' group-<group> ... ', for the aggregate 'verify'.
          # The template: the predicate that verify.sh uses for the
          # framework-only self-tests, with the repository of the run.
          role=unknown
          if [[ -f scripts/lib/template-repository.sh ]]; then
            source scripts/lib/template-repository.sh
            role="$(template_repository_role . "$REPOSITORY")"
            role="${role%%$'\n'*}"
          fi
          # workflow: whether a file under paths: of
          # scripts/verify-workflow.conf differs between BASE and HEAD:
          # yes, no, or unknown. Unknown without BASE, with the zeros of a
          # first push, and with a BASE that is not an ancestor of HEAD,
          # as after a forced push.
          workflow=unknown
          paths=""
          if [[ -f scripts/verify-workflow.conf ]]; then
            paths="$(sed -n '/^paths:/{s/^paths:[[:space:]]*//p;q;}' scripts/verify-workflow.conf)"
          fi
          if [[ -n "$paths" && "${BASE:-}" =~ ^[0-9a-f]{40,64}$ && "$BASE" =~ [1-9a-f] ]] &&
            git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
            read -r -a specs <<<"$paths"
            if changed="$(git diff --no-renames --name-only "$BASE" HEAD -- "${specs[@]}")"; then
              if [[ -n "$changed" ]]; then workflow=yes; else workflow=no; fi
            fi
          fi
          # self_tests: whether the self-tests can run at all. The
          # template's push to main runs everything; its pull request is
          # decided as a project's.
          if [[ "$role" == template && "$EVENT" != pull_request ]]; then
            verify=all self_tests=run
          elif [[ ( "$EVENT" == pull_request || "$EVENT" == push ) && "$workflow" == no ]]; then
            verify=changed self_tests=skip
          else
            verify=all self_tests=run
          fi
          # A group of the self-tests does not start when they cannot run,
          # nor in a project when all its self-tests are framework-only. A
          # group that has a check of scripts/verify.conf, or 'default',
          # always starts.
          skip=" "
          if [[ -f scripts/verify-workflow.conf ]]; then
            pattern='^[a-z0-9][a-z0-9-]*[[:space:]]*\[([a-z0-9][a-z0-9-]*)\]([[:space:]]+partition[[:space:]]+[^[:space:]:]+)?([[:space:]]+budget)?([[:space:]]+framework)?:'
            declare -A own=() tests=() plain=()
            if [[ -f scripts/verify.conf ]]; then
              while IFS= read -r line || [[ -n "$line" ]]; do
                [[ ! "$line" =~ $pattern ]] || own[${BASH_REMATCH[1]}]=1
              done <scripts/verify.conf
            fi
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ "$line" =~ $pattern ]] || continue
              tests[${BASH_REMATCH[1]}]=1
              [[ -n "${BASH_REMATCH[4]}" ]] || plain[${BASH_REMATCH[1]}]=1
            done <scripts/verify-workflow.conf
            for group in $(printf '%s\n' "${!tests[@]}" | sort); do
              [[ "$group" != default && -z "${own[$group]:-}" ]] || continue
              if [[ "$self_tests" == skip || ( "$role" == project && -z "${plain[$group]:-}" ) ]]; then
                skip+="group-$group "
              fi
            done
          fi
          echo "verify=$verify" >>"$GITHUB_OUTPUT"
          echo "skip=$skip" >>"$GITHUB_OUTPUT"
          echo "Verification scope: $verify (workflow files changed: $workflow)"
          echo "Group jobs that do not start:${skip% }"

  # The mapping of the groups onto the jobs of this file, as the jobs declare
  # it: every group of ./scripts/verify.sh --groups has exactly one job
  # 'group-<group>'. It fails for a group of a project's own that this file
  # has no job for; see the comment at the top.
  mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every group is declared by exactly one job
        run: ./scripts/check-ci-groups.sh --workflow .github/workflows/ci.yml

  # The group of the checks without a group: the project's own checks and,
  # in the template, the website, which only this job sets up and reports.
  group-default:
    needs: scope
    # Runs also when the scope could not be decided, then with --all; only
    # a cancelled run skips it.
    if: ${{ !cancelled() }}
    env:
      VERIFY_GROUP: default
    runs-on: ubuntu-latest
    steps:
      # The full history: verify.sh compares with the base branch to see
      # whether a workflow file changed, and runs every self-test when it
      # cannot tell, as in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The project's own toolchains and dependencies (Python, uv, Node.js,
      # ...): a composite action that the project owns and the template never
      # ships, so this file stays the template's. It runs only when the
      # project has it, before the verification. See docs/development.md,
      # "The project's CI setup".
      - name: Set up the project
        if: hashFiles('.github/actions/project-setup/action.yml') != ''
        uses: ./.github/actions/project-setup
      # The website of the template is built by the verification
      # and needs the Node version it pins. The site is recognised by its
      # marker website/.codeyard-site: a project has no site, or a website/
      # of its own without the marker, and skips these steps. Its check is
      # in this group, so no other job installs Node or the browser.
      - if: hashFiles('website/.codeyard-site') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install the website browser dependencies
        if: hashFiles('website/.codeyard-site') != ''
        working-directory: website
        run: npm ci --no-audit --no-fund && npx --no-install playwright install --with-deps chromium
      - name: Verify the group
        env:
          SCOPE: ${{ needs.scope.outputs.verify }}
        run: |
          if [[ "$SCOPE" == changed ]]; then
            ./scripts/verify.sh --only "$VERIFY_GROUP"
          else
            ./scripts/verify.sh --all --only "$VERIFY_GROUP"
          fi
      - name: Attach website screenshots and reports
        id: website-artifact
        if: always() && hashFiles('website/.codeyard-site') != '' && hashFiles('website/reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: website-review
          path: website/reports/
          retention-days: 30
      - name: Link the visual review from the pull request check
        if: always() && hashFiles('website/.codeyard-site') != '' && hashFiles('website/reports/**') != ''
        env:
          ARTIFACT_URL: ${{ steps.website-artifact.outputs.artifact-url }}
        run: |
          echo "[Download website screenshots and reports]($ARTIFACT_URL). Review every page at 375, 768 and 1440 px in both themes against website/design/PRODUCT.md and website/validation.md." >> "$GITHUB_STEP_SUMMARY"

  # The self-tests, spread over groups by their duration
  # (scripts/verify-workflow.conf).
  group-adopted-project:
    needs: scope
    # Runs also when the scope could not be decided, then with --all; a
    # cancelled run skips it, and so does the scope when the group has
    # nothing to run.
    if: ${{ !cancelled() && !contains(needs.scope.outputs.skip, ' group-adopted-project ') }}
    env:
      VERIFY_GROUP: adopted-project
    runs-on: ubuntu-latest
    steps:
      # The full history: verify.sh compares with the base branch to see
      # whether a workflow file changed, and runs every self-test when it
      # cannot tell, as in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The project's own toolchains and dependencies (Python, uv, Node.js,
      # ...): a composite action that the project owns and the template never
      # ships, so this file stays the template's. It runs only when the
      # project has it, before the verification. See docs/development.md,
      # "The project's CI setup".
      - name: Set up the project
        if: hashFiles('.github/actions/project-setup/action.yml') != ''
        uses: ./.github/actions/project-setup
      - name: Verify the group
        env:
          SCOPE: ${{ needs.scope.outputs.verify }}
        run: |
          if [[ "$SCOPE" == changed ]]; then
            ./scripts/verify.sh --only "$VERIFY_GROUP"
          else
            ./scripts/verify.sh --all --only "$VERIFY_GROUP"
          fi

  group-self-tests-1:
    needs: scope
    # Runs also when the scope could not be decided, then with --all; a
    # cancelled run skips it, and so does the scope when the group has
    # nothing to run.
    if: ${{ !cancelled() && !contains(needs.scope.outputs.skip, ' group-self-tests-1 ') }}
    env:
      VERIFY_GROUP: self-tests-1
    runs-on: ubuntu-latest
    steps:
      # The full history: verify.sh compares with the base branch to see
      # whether a workflow file changed, and runs every self-test when it
      # cannot tell, as in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The project's own toolchains and dependencies (Python, uv, Node.js,
      # ...): a composite action that the project owns and the template never
      # ships, so this file stays the template's. It runs only when the
      # project has it, before the verification. See docs/development.md,
      # "The project's CI setup".
      - name: Set up the project
        if: hashFiles('.github/actions/project-setup/action.yml') != ''
        uses: ./.github/actions/project-setup
      - name: Verify the group
        env:
          SCOPE: ${{ needs.scope.outputs.verify }}
        run: |
          if [[ "$SCOPE" == changed ]]; then
            ./scripts/verify.sh --only "$VERIFY_GROUP"
          else
            ./scripts/verify.sh --all --only "$VERIFY_GROUP"
          fi

  group-self-tests-2:
    needs: scope
    # Runs also when the scope could not be decided, then with --all; a
    # cancelled run skips it, and so does the scope when the group has
    # nothing to run.
    if: ${{ !cancelled() && !contains(needs.scope.outputs.skip, ' group-self-tests-2 ') }}
    env:
      VERIFY_GROUP: self-tests-2
    runs-on: ubuntu-latest
    steps:
      # The full history: verify.sh compares with the base branch to see
      # whether a workflow file changed, and runs every self-test when it
      # cannot tell, as in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The project's own toolchains and dependencies (Python, uv, Node.js,
      # ...): a composite action that the project owns and the template never
      # ships, so this file stays the template's. It runs only when the
      # project has it, before the verification. See docs/development.md,
      # "The project's CI setup".
      - name: Set up the project
        if: hashFiles('.github/actions/project-setup/action.yml') != ''
        uses: ./.github/actions/project-setup
      - name: Verify the group
        env:
          SCOPE: ${{ needs.scope.outputs.verify }}
        run: |
          if [[ "$SCOPE" == changed ]]; then
            ./scripts/verify.sh --only "$VERIFY_GROUP"
          else
            ./scripts/verify.sh --all --only "$VERIFY_GROUP"
          fi

  group-self-tests-3:
    needs: scope
    # Runs also when the scope could not be decided, then with --all; a
    # cancelled run skips it, and so does the scope when the group has
    # nothing to run.
    if: ${{ !cancelled() && !contains(needs.scope.outputs.skip, ' group-self-tests-3 ') }}
    env:
      VERIFY_GROUP: self-tests-3
    runs-on: ubuntu-latest
    steps:
      # The full history: verify.sh compares with the base branch to see
      # whether a workflow file changed, and runs every self-test when it
      # cannot tell, as in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The project's own toolchains and dependencies (Python, uv, Node.js,
      # ...): a composite action that the project owns and the template never
      # ships, so this file stays the template's. It runs only when the
      # project has it, before the verification. See docs/development.md,
      # "The project's CI setup".
      - name: Set up the project
        if: hashFiles('.github/actions/project-setup/action.yml') != ''
        uses: ./.github/actions/project-setup
      - name: Verify the group
        env:
          SCOPE: ${{ needs.scope.outputs.verify }}
        run: |
          if [[ "$SCOPE" == changed ]]; then
            ./scripts/verify.sh --only "$VERIFY_GROUP"
          else
            ./scripts/verify.sh --all --only "$VERIFY_GROUP"
          fi

  # The one required check. 'always()' makes it run when a job it needs
  # failed, was cancelled, or was skipped: a skipped required check counts as
  # passed in a branch protection, so it must never be skipped itself. It
  # fails unless every job it needs succeeded and every group has its job
  # here; a group job may be skipped only when the job 'scope' named it.
  verify:
    if: always()
    needs: [scope, mapping, group-default, group-adopted-project, group-self-tests-1, group-self-tests-2, group-self-tests-3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          ./scripts/check-ci-groups.sh --results "$NEEDS" --scope scope
